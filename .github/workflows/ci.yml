name: My First CI Pipeline

on:
  push:
    branches:
      - master

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Display welcome message
      - name: Display welcome message
        run: echo "Hello! My first GitHub Actions pipeline is working."

      # Step 3: Check Git version
      - name: Check Git version
        run: git --version

      # Step 4: Display current date
      - name: Display current date
        run: date

      # Step 5: Display project files
      - name: List project files
        run: ls -la


      # Step 6: Check application file
      - name: Check application file
        run: test -f app.txt    
 
     
  build-job:
    needs: first-job
    runs-on: ubuntu-latest

    steps:
      - name: Display build message
        run: echo "Building my banking application..."
  deploy-job:
    needs: build-job
    runs-on: ubuntu-latest

    steps:
      - name: Display deployment message
        run: echo "Deploying my banking application..."
